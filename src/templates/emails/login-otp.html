<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>BMS Login OTP</title>
</head>

<body
    style="
        margin: 0;
        padding: 0;
        background-color: #f4f6f8;
        font-family: Arial, sans-serif;
    "
>
    <div
        style="
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
        "
    >

        <h2
            style="
                margin-bottom: 20px;
                color: #222;
            "
        >
            Booking Management System
        </h2>

        <p>
            Hello <strong>{{name}}</strong>,
        </p>

        <p>
            You requested to login using OTP.
            Please use the OTP below:
        </p>

        <div
            style="
                text-align: center;
                margin: 30px 0;
            "
        >
            <span
                style="
                    display: inline-block;
                    padding: 15px 30px;
                    background: #f1f5f9;
                    border-radius: 8px;
                    font-size: 32px;
                    font-weight: bold;
                    letter-spacing: 8px;
                    color: #2563eb;
                "
            >
                {{otp}}
            </span>
        </div>

        <p>
            This OTP is valid for
            <strong>5 minutes</strong>.
        </p>

        <p>
            Please do not share this OTP with anyone.
        </p>

        <p>
            If you did not request this login OTP,
            please ignore this email.
        </p>

        <hr
            style="
                margin: 30px 0;
                border: none;
                border-top: 1px solid #ddd;
            "
        >

        <p
            style="
                font-size: 12px;
                color: #777;
            "
        >
            © Booking Management System
        </p>

    </div>
</body>
</html>
